# The kit's own test: scaffold a fresh project with `lk new` and run `lk ci` on it.
name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with: { go-version: "1.25" }
      - uses: actions/setup-java@v6.0.1
        with: { distribution: temurin, java-version: "21" }
      - uses: DeLaGuardo/setup-clojure@13.7.0
        with: { cli: 1.12.1.1561 }
      - uses: actions/setup-node@v7.0.0
        with: { node-version: "22", cache: npm, cache-dependency-path: check-site/package-lock.json }
      - uses: astral-sh/setup-uv@v10.2.0
      - name: scaffold and verify a sample project
        run: |
          git config --global user.email ci@example.com && git config --global user.name ci
          bin/lk new "$RUNNER_TEMP/sample" --title "Sample" --part "basics:Basics:The first part"
          cd "$RUNNER_TEMP/sample"
          "$GITHUB_WORKSPACE/bin/lk" exercises --no-check
          git add -A && git commit -qm init
          "$GITHUB_WORKSPACE/bin/lk" ci

# Reusable workflow for learning projects. A project's whole workflow:
#
#   permissions: { contents: read, pages: write, id-token: write }
#   jobs:
#     learning:
#       uses: dpsutton/learning-kit/.github/workflows/learning.yml@main
#
# It checks out the project and this kit, runs `lk ci` (tests, demos, exercise track, excerpt
# verification, site build with wasm, headless-Chrome check), and on pushes to main deploys the
# built site to GitHub Pages.
name: learning-kit
on:
  workflow_call:
    inputs:
      kit-repo: { type: string, default: dpsutton/learning-kit }
      kit-ref: { type: string, default: main }
      deploy: { type: boolean, default: true }

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/checkout@v7.0.1
        with: { repository: "${{ inputs.kit-repo }}", ref: "${{ inputs.kit-ref }}", path: .kit }
      - uses: actions/setup-go@v7.0.0
        with: { go-version-file: go/go.mod, cache-dependency-path: go/go.mod }
      - uses: actions/setup-java@v6.0.1
        with: { distribution: temurin, java-version: "21" }
      - uses: DeLaGuardo/setup-clojure@13.7.0
        with: { cli: 1.12.1.1561 }
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: clj-${{ hashFiles('clojure/deps.edn') }}
      - uses: actions/setup-node@v7.0.0
        with: { node-version: "22", cache: npm, cache-dependency-path: .kit/check-site/package-lock.json }
      - uses: astral-sh/setup-uv@v10.2.0
      - name: lk ci
        run: .kit/bin/lk ci
      - if: inputs.deploy && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6.0.0
      - if: inputs.deploy && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5.0.0
        with: { path: _site }

  deploy:
    needs: verify
    if: inputs.deploy && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
